services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: billbook
      POSTGRES_PASSWORD: billbook
      POSTGRES_DB: billbook
    # 400 connections so the concurrency tests can hold 100+ simultaneous transactions.
    command: postgres -c max_connections=400
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billbook -d billbook"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://billbook:billbook@db:5432/billbook
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-change-me-in-production-0123456789}
    env_file:
      - path: .env
        required: false
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

  # Run the full test-suite (incl. the PostgreSQL-only concurrency tests):  docker compose run --rm tests
  tests:
    build: .
    profiles: ["test"]
    environment:
      DATABASE_URL: postgresql+psycopg://billbook:billbook@db:5432/billbook
      TEST_DATABASE_URL: postgresql+psycopg://billbook:billbook@db:5432/billbook_test
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "PGPASSWORD=billbook python -c \"import psycopg; c=psycopg.connect('postgresql://billbook:billbook@db/billbook', autocommit=True); c.execute('CREATE DATABASE billbook_test')\" 2>/dev/null;
             pytest --cov=app --cov-report=term-missing"

volumes:
  pgdata:
